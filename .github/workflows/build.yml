name: Build Mac App

# 推送 main 分支自动打包；也可在 Actions 页面手动点 Run workflow
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14      # Apple Silicon (M1/M2/M3/M4) arm64
            arch: arm64
            artifact: YouTubeDownloader-Mac-arm64
          - runner: macos-13      # Intel 芯片 x86_64
            arch: x86_64
            artifact: YouTubeDownloader-Mac-Intel
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python deps
        run: |
          python3 -m pip install --upgrade pip
          pip3 install yt-dlp curl_cffi pyinstaller

      - name: Fetch static ffmpeg / ffprobe (no external libs)
        id: ff
        run: |
          npm install ffmpeg-static @ffprobe-installer/ffprobe >/dev/null 2>&1
          FFMPEG=$(node -e "console.log(require('ffmpeg-static'))")
          FFPROBE=$(node -e "console.log(require('@ffprobe-installer/ffprobe').path)")
          chmod +x "$FFMPEG" "$FFPROBE"
          echo "ffmpeg=$FFMPEG" >> "$GITHUB_OUTPUT"
          echo "ffprobe=$FFPROBE" >> "$GITHUB_OUTPUT"
          echo "node=$(which node)" >> "$GITHUB_OUTPUT"
          echo "使用静态 ffmpeg: $FFMPEG"
          echo "使用静态 ffprobe: $FFPROBE"

      - name: Build .app (${{ matrix.arch }})
        run: |
          python3 -m PyInstaller --onefile --windowed \
            --name "YouTubeDownloader" \
            --icon "app.icns" \
            --add-data "${{ steps.ff.outputs.ffmpeg }}:." \
            --add-data "${{ steps.ff.outputs.ffprobe }}:." \
            --add-data "${{ steps.ff.outputs.node }}:." \
            --add-data "叮一声，完成提示.mp3:." \
            --add-data "browser-extension:browser-extension" \
            --collect-all curl_cffi \
            "YouTube下载器_mac.py"

      - name: Assemble release folder
        run: |
          mkdir -p release
          cp -R "dist/YouTubeDownloader.app" release/
          cp -R "browser-extension" release/browser-extension
          cp "Mac版使用说明.txt" release/
          cd release && zip -r "../${{ matrix.artifact }}.zip" .

      - name: Upload artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
