name: Build Mac App

# 推送 main 分支自动打包；也可在 Actions 页面手动点 Run workflow
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg and node
        run: brew install ffmpeg node

      - name: Install Python deps
        run: |
          python3 -m pip install --upgrade pip
          pip3 install yt-dlp curl_cffi pyinstaller

      - name: Locate toolchain paths
        id: tools
        run: |
          echo "ffmpeg=$(which ffmpeg)" >> "$GITHUB_OUTPUT"
          echo "ffprobe=$(which ffprobe)" >> "$GITHUB_OUTPUT"
          echo "node=$(which node)" >> "$GITHUB_OUTPUT"

      - name: Build .app
        run: |
          python3 -m PyInstaller --onefile --windowed \
            --name "YouTubeDownloader" \
            --icon "app.icns" \
            --add-data "${{ steps.tools.outputs.ffmpeg }}:." \
            --add-data "${{ steps.tools.outputs.ffprobe }}:." \
            --add-data "${{ steps.tools.outputs.node }}:." \
            --add-data "叮一声，完成提示.mp3:." \
            --add-data "browser-extension:browser-extension" \
            --collect-all curl_cffi \
            "YouTube下载器_mac.py"

      - name: Assemble release folder
        run: |
          mkdir -p release
          cp -R "dist/YouTubeDownloader.app" release/
          cp -R "browser-extension" release/browser-extension
          cp "Mac版使用说明.txt" release/
          cd release && zip -r "../YouTubeDownloader-Mac.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeDownloader-Mac
          path: YouTubeDownloader-Mac.zip
